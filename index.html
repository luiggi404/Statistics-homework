<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics Homework</title>
  <style>
    :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1da; --accent:#2f5d8a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#151514; --fg:#ecebe6; --muted:#9a9993; --line:#2c2c2a; --accent:#8db8e3; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 40px; }
    ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); padding: 16px 0; display:flex; gap:16px; align-items:baseline; }
    .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.5em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Statistics Homework</h1>
    <p class="sub">Luiggi — raccolta degli homework di statistica</p>
    <ol>
      <li><span class="n">01</span><span class="empty">In arrivo</span></li>
    </ol>
    <footer>Pubblicato con GitHub Pages</footer>
  </main>
</body>
</html>
